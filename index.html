<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Professional Location Sketch Maker V3.2</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

    <div class="top-menu">

        <!-- RIBBON ROW 1: Mode controls | Page | Line/Draw | QR | Actions -->
        <div class="ribbon-row">

            <div class="ribbon-group">
                <div class="ribbon-group-inner">
                    <span class="group-label">Mode</span>
                    <div class="ribbon-controls">
                        <button id="drawToggleBtn" class="toggle-btn" onclick="toggleDrawMode()">🔒 Draw: OFF</button>
                        <button id="viewModeBtn" style="background-color: #8e44ad;" onclick="toggleViewMode()">👉 Items</button>
                        <button id="rotateToggleBtn" onclick="toggleRotateTab()">🔄 Rotate: OFF</button>
                        <button id="magnifierToggleBtn" class="toggle-btn" style="background-color: #27ae60;" onclick="toggleMagnifier()">🔍 Zoom: ON</button>
                    </div>
                </div>
            </div>

            <div class="ribbon-group">
                <div class="ribbon-group-inner">
                    <span class="group-label">Page</span>
                    <div class="ribbon-controls">
                        <select id="pageOrientation" onchange="changePageOrientation()" style="width: 145px; font-weight: bold; color: #1a73e8; border: 1px solid #1a73e8;">
                            <option value="portrait" selected>▯ Portrait (A4)</option>
                            <option value="landscape">▭ Landscape (A4)</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="ribbon-group">
                <div class="ribbon-group-inner">
                    <span class="group-label">✏️ Draw Line</span>
                    <div class="ribbon-controls">
                        <select id="roadType" style="width: 130px;">
                            <option value="nh">🛣️ NH Road</option>
                            <option value="sh">🛤️ SH Road</option>
                            <option value="pwd">PWD Road</option>
                            <option value="panchayat">Panchayat Road</option>
                            <option value="mud">Mud Road</option>
                            <option value="path">🚶 Foot Path</option>
                            <option value="stream">🌊 Stream</option>
                            <option value="railway">🚂 Railway</option>
                            <option value="electricLine">⚡ Electric Line</option>
                            <option value="plotLine">🟥 Plot Line</option>
                            <option value="squarePlot">🟩 Square Plot</option>
                            <option value="pointerArrow">➡️ Pointer Arrow</option>
                        </select>
                        <label class="checkbox-row"><input type="checkbox" id="straightMode" checked> Straight</label>
                        <button id="eraserToggleBtn" class="toggle-btn" onclick="toggleEraserMode()">🧽 Eraser: OFF</button>
                        <select id="eraserSize" onchange="updateEraserSize()" style="width: 70px;" title="Eraser size">
                            <option value="12">Small</option>
                            <option value="20" selected>Medium</option>
                            <option value="32">Large</option>
                        </select>
                        <button class="toggle-btn" onclick="undoLast()">↩️ Undo</button>
                        <button class="toggle-btn" onclick="redoLast()" style="background-color:#5f6368;">↪️ Redo</button>
                        <button class="toggle-btn" onclick="undoLastItem()" style="background-color:#7f8c8d;">↩️ Item</button>
                        <button class="toggle-btn" onclick="redoLastItem()" style="background-color:#7f8c8d;">↪️ Item</button>
                    </div>
                </div>
            </div>

            <div class="ribbon-group">
                <div class="ribbon-group-inner">
                    <span class="group-label">📍 Map QR</span>
                    <div class="ribbon-controls">
                        <input type="text" id="mapLinkInput" placeholder="Paste Google Map URL..." style="width: 170px;">
                        <button class="success-btn" onclick="addGoogleMapQRCode()">➕ QR</button>
                    </div>
                </div>
            </div>

            <div class="ribbon-end">
                <button id="deviceModeBtn" onclick="toggleDeviceMode()" style="background-color: #2c3e50;">🖥️ PC Mode</button>
                <button class="danger-btn" onclick="clearMap()">🗑️ Clear</button>
                <button class="success-btn" onclick="compileAndSavePDF()">💾 Save PDF</button>
                <button class="success-btn" style="background-color:#8e44ad;" onclick="saveAsDXF()">📐 Save DXF</button>
                <button class="toggle-btn" style="background-color:#16a085;" onclick="document.getElementById('dxfUploader').click()">📂 Upload DXF</button>
                <input type="file" id="dxfUploader" accept=".dxf" style="display:none;">
            </div>
        </div>

        <!-- RIBBON ROW 2: Symbol | Text | Upload -->
        <div class="ribbon-row">

            <div class="ribbon-group">
                <div class="ribbon-group-inner">
                    <span class="group-label">🏠 Symbol</span>
                    <div class="ribbon-controls">
                        <select id="iconSelect" style="width: 145px;">
                            <option value="NORTH_ARROW|North Arrow">🧭 North Arrow</option>
                            <option value="DIR_ARROW|Direction Arrow">➡️ Direction Arrow</option>
                            <option value="🚩|Main Plot">🚩 Main Plot</option>
                            <option value="UTILITY_POLE|Electric Post">⚡ Electric Post</option>
                            <option value="🏠|House">🏠 House</option>
                            <option value="🏢|Building">🏢 Building</option>
                            <option value="🛕|Temple">🛕 Temple</option>
                            <option value="🕌|Mosque">🕌 Mosque</option>
                            <option value="⛪|Church">⛪ Church</option>
                            <option value="🌳|Tree">🌳 Tree</option>
                            <option value="🏞️|Pond">🏞️ Pond</option>
                            <option value="🕳️|Well">🕳️ Well</option>
                            <option value="🛑|Junction">🛑 Junction</option>
                            <option value="⛽|Petrol Pump">⛽ Petrol Pump</option>
                            <option value="🏥|Hospital">🏥 Hospital</option>
                            <option value="🏦|Bank">🏦 Bank</option>
                            <option value="🏫|School">🏫 School</option>
                            <option value="🚌|Bus Stop">🚌 Bus Stop</option>
                            <option value="🚉|Railway Station">🚉 Railway Station</option>
                            <option value="🚓|Police Station">🚓 Police Station</option>
                            <option value="🔥|Fire Station">🔥 Fire Station</option>
                            <option value="🏛️|Village Office">🏛️ Village Office</option>
                            <option value="🏢|Panchayat Office">🏢 Panchayat Office</option>
                            <option value="🏪|Shop">🏪 Shop</option>
                            <option value="🏬|Market">🏬 Market</option>
                            <option value="📮|Post Office">📮 Post Office</option>
                            <option value="📡|Mobile Tower">📡 Mobile Tower</option>
                            <option value="⚡|Transformer">⚡ Transformer</option>
                            <option value="💧|Water Tank">💧 Water Tank</option>
                            <option value="🚰|Water Tap">🚰 Water Tap</option>
                            <option value="🌉|Bridge">🌉 Bridge</option>
                            <option value="🅿️|Parking">🅿️ Parking</option>
                            <option value="🏭|Factory">🏭 Factory</option>
                            <option value="🏗️|Construction">🏗️ Construction</option>
                            <option value="🌲|Forest">🌲 Forest</option>
                            <option value="🌴|Coconut Tree">🌴 Coconut Tree</option>
                            <option value="🪦|Cemetery">🪦 Cemetery</option>
                            <option value="🚜|Farm">🚜 Farm</option>
                            <option value="🐄|Cattle Farm">🐄 Cattle Farm</option>
                            <option value="🚏|Auto Stand">🚏 Auto Stand</option>
                            <option value="🚖|Taxi Stand">🚖 Taxi Stand</option>
                            <option value="⚓|Harbour">⚓ Harbour</option>
                            <option value="🏖️|Ground">🏖️ Ground</option>
                            <option value="🚧|Road Work">🚧 Road Work</option>
                        </select>
                        <select id="iconSizeSelect" style="width: 70px;">
                            <option value="large">Large</option>
                            <option value="medium" selected>Medium</option>
                            <option value="small">Small</option>
                        </select>
                        <select id="labelFontSize" style="width: 55px;" title="Label font size">
                            <option value="9px">9px</option>
                            <option value="11px" selected>11px</option>
                            <option value="13px">13px</option>
                            <option value="15px">15px</option>
                            <option value="18px">18px</option>
                        </select>
                        <button class="success-btn" onclick="addIcon()">➕ Add</button>
                    </div>
                </div>
            </div>

            <div class="ribbon-group">
                <div class="ribbon-group-inner">
                    <span class="group-label">📝 Text Label</span>
                    <div class="ribbon-controls">
                        <input type="text" id="customTextInput" placeholder="Type text..." style="width: 100px;">
                        <select id="fontSizeSelect" style="width: 60px;">
                            <option value="14px">Sm</option>
                            <option value="18px" selected>Md</option>
                            <option value="24px">Lg</option>
                            <option value="32px">XL</option>
                        </select>
                        <button class="success-btn" onclick="addCustomText()">➕ Add</button>
                    </div>
                </div>
            </div>

            <div class="ribbon-group">
                <div class="ribbon-group-inner">
                    <span class="group-label">🖼️ Background</span>
                    <div class="ribbon-controls">
                        <input type="file" id="bgUploader" style="width: 140px;">
                        <button class="danger-btn" onclick="removeUploadedBackground()">❌ Remove</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div class="workspace-wrapper" id="wrapper">
        <div class="workspace-container" id="container">
            <div class="a4-page" id="a4Page">
                <div class="canvas-container" id="canvasContainer">
                    <canvas id="mapCanvas" width="794" height="1123"></canvas>
                </div>
            </div>
            <div class="screen-metadata">👤 Muraleedharan P | 📞 9400849115</div>
        </div>
    </div>

    <div id="magnifier">
        <canvas id="magnifierCanvas" width="140" height="140"></canvas>
    </div>

    <div id="onlineUsersBadge" title="Users currently using this tool">
        <span class="pulse-dot"></span>
        <span id="onlineUsersCount">1</span> Online
    </div>

    <script src="script.js"></script>
</body>
</html>
